<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the Coding Club.">
    <meta name="author" content="Paras Bharti">
    <title>Coding Club | Register</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Registration</h1>
        <p>Become a member of our Coding Club</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section class="card">
            <h2>Registration Form</h2>

            <form action="#" method="get">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>

                <label for="date">Date of Birth:</label>
                <input type="date" id="date" name="dob" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number"
                       pattern="[0-9]{10}" required>

                <p class="form-label">Year of Study:</p>
                <div class="choice">
                    <label><input type="radio" name="year" value="1st" required> 1st Year</label>
                    <label><input type="radio" name="year" value="2nd"> 2nd Year</label>
                    <label><input type="radio" name="year" value="3rd"> 3rd Year</label>
                    <label><input type="radio" name="year" value="4th"> 4th Year</label>
                </div>

                <p class="form-label">Choose Your Interests:</p>
                <div class="choice">
                    <label><input type="checkbox" name="interest" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="interest" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="interest" value="Java"> Java</label>
                    <label><input type="checkbox" name="interest" value="JavaScript"> JavaScript</label>
                </div>

                <label for="level">Programming Experience:</label>
                <select id="level" name="level" required>
                    <option value="">Select your level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>

                <label for="message">Why do you want to join?</label>
                <textarea id="message" name="message" rows="4"
                          placeholder="Write your message here"></textarea>

                <button type="submit" class="btn">Submit Registration</button>
                <button type="reset" class="btn secondary">Reset Form</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Coding Club | Invertis University</p>
    </footer>

</body>
</html>
